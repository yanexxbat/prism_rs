[package]
name = "prism-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
prism-core.workspace = true
prism-net.workspace = true
prism-auth.workspace = true
prism-minecraft.workspace = true
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
trash = "5"
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "glow"] }

[[bin]]
name = "prism_rs"
path = "src/main.rs"

[dev-dependencies]
egui_kittest = "0.31"
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.5"
